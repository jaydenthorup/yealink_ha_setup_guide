[general]
; Asterisk Extensions Configuration
; Routes Yealink calls to Home Assistant, and Home Assistant calls
; to the Yealink(s) as an intercom (auto-answer on speaker).

[from_yealink]
; Hotline to Home Assistant - use homeassistant endpoint
exten => 100,1,Answer()
 same => n,Verbose(2,Hotline to HA)
 same => n,Dial(PJSIP/homeassistant,30)
 same => n,HangUp()

; Ring the OTHER phone (101) from any registered Yealink
exten => 101,1,Answer()
 same => n,Dial(PJSIP/yealink,30)
 same => n,HangUp()

; When Yealink picks up phone (offhook without dialing), dial hotline
exten => s,1,Answer()
 same => n,Verbose(2,Yealink offhook - calling HA)
 same => n,Dial(PJSIP/homeassistant,30)
 same => n,HangUp()

; Fallback for any other extension dialed
exten => _X.,1,Answer()
 same => n,Verbose(2,Forwarding to HA: ${EXTEN})
 same => n,Dial(PJSIP/homeassistant/${EXTEN},30)
 same => n,HangUp()

[from_homeassistant]
; Calls coming FROM Home Assistant -> ring the Yealink(s) as an intercom.
;
; Page() bridges EVERY answering phone into one conference, so BOTH speakers
; play the announcement SIMULTANEOUSLY. (A plain Dial(A&B) rings both but
; connects only the FIRST to answer, so only one phone speaks.)
;
; Page mixing requires codec_opus (opus<->slin). A stock Asterisk ships only
; res_format_attr_opus (passthrough) and Page dies with
;   "No translator path (slin)->(opus)"  -- see README for installing codec_opus.
;
; 'q' suppresses Page's beep (which otherwise fails: "Unable to open beep
; (format (opus))").
;
; TIMEOUT(absolute) caps the call because Page has no S(x) option and HA's VoIP
; satellite never ends the call on its own (announce loops, start_conversation
; listens until the PHONE hangs up). NOTE: TIMEOUT(absolute) is a DURATION in
; seconds, NOT an epoch -- '$[${EPOCH}+8]' silently never fires. Tune the 8.
;
; We do NOT Answer() here: Page answers HA's leg as it bridges, so the phones
; should be up (auto-answered) by then; the alert header gets them on speaker.
exten => asterisk,1,Verbose(2,HA paging both Yealinks)
 same => n,Set(TIMEOUT(absolute)=8)
 same => n,Page(PJSIP/yealink&PJSIP/yealink2,qb(intercom^s^1))
 same => n,HangUp()

exten => _X.,1,Verbose(2,HA paging both Yealinks: ${EXTEN})
 same => n,Set(TIMEOUT(absolute)=8)
 same => n,Page(PJSIP/yealink&PJSIP/yealink2,qb(intercom^s^1))
 same => n,HangUp()

[intercom]
; Pre-dial handler (b(intercom^s^1) in the Dial/Page above): runs on the
; OUTGOING Yealink leg right before the INVITE is sent and injects the
; header the phone uses to auto-answer hands-free on speaker. Yealink
; honours any of:
;   Alert-Info: auto answer
;   Alert-Info: info=alert-autoanswer
;   Alert-Info: answer-after=0
;   Call-Info: ;answer-after=0
; The phone's per-account "Auto Answer" must be enabled for this to fire.
exten => s,1,Set(PJSIP_HEADER(add,Alert-Info)=info=alert-autoanswer)
 same => n,Return()

[to_homeassistant]
; Default context (optional)
exten => _X.,1,Dial(PJSIP/homeassistant/${EXTEN})
 same => n,HangUp()

[default]
; Catch-all for safety
exten => _X.,1,Busy()
 same => n,HangUp()
