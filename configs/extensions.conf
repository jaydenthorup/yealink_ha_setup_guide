[general]
; Asterisk Extensions Configuration
; Routes Yealink calls to Home Assistant, and Home Assistant calls
; to the Yealink as an intercom (auto-answer on speaker).

[from_yealink]
; Hotline to Home Assistant - use homeassistant endpoint
exten => 100,1,Answer()
 same => n,Verbose(2,Hotline to HA)
 same => n,Dial(PJSIP/homeassistant,30)
 same => n,HangUp()

; When Yealink picks up phone (offhook without dialing), dial hotline
exten => s,1,Answer()
 same => n,Verbose(2,Yealink offhook - calling HA)
 same => n,Dial(PJSIP/homeassistant,30)
 same => n,HangUp()

; Fallback for any other extension dialed
exten => _X.,1,Answer()
 same => n,Verbose(2,Forwarding to HA: ${EXTEN})
 same => n,Dial(PJSIP/homeassistant/${EXTEN},30)
 same => n,HangUp()

[from_homeassistant]
; Calls coming FROM Home Assistant -> ring the Yealink(s) as an intercom.
; NOTE: do NOT Answer() here. If we answer HA's leg before the phone
; answers, HA starts streaming TTS into a channel with no other leg up
; and the start of the announcement is lost. Let Dial() answer when the
; phone leg answers, so the audio is bridged from the first syllable.
; Dial(A&B) rings BOTH phones; the first to answer is connected. Simultaneous
; paging to both speakers would need Page()/ConfBridge, which must transcode
; opus<->slin to mix. Without codec_opus (only res_format_attr_opus is loaded)
; that fails with "No translator path (slin)->(opus)". Dial(A&B) is passthrough.
; Also S(8): hang up 8s after the phone answers, since HA's VoIP satellite
; never ends the call on its own (announce loops, start_conversation listens
; until the PHONE hangs up). Tune the seconds to exceed the announcement.
exten => asterisk,1,Verbose(2,HA calling Yealink intercom)
 same => n,Dial(PJSIP/yealink&PJSIP/yealink2,30,S(8)b(intercom^s^1))
 same => n,HangUp()

exten => _X.,1,Verbose(2,HA calling Yealink intercom: ${EXTEN})
 same => n,Dial(PJSIP/yealink&PJSIP/yealink2,30,S(8)b(intercom^s^1))
 same => n,HangUp()

[intercom]
; Pre-dial handler (b(intercom^s^1) in the Dial above): runs on the
; OUTGOING Yealink leg right before the INVITE is sent and injects the
; header the phone uses to auto-answer hands-free on speaker. Yealink
; honours any of:
;   Alert-Info: auto answer
;   Alert-Info: info=alert-autoanswer
;   Alert-Info: answer-after=0
;   Call-Info: ;answer-after=0
; The phone's per-account "Auto Answer" must be enabled for this to fire.
exten => s,1,Set(PJSIP_HEADER(add,Alert-Info)=info=alert-autoanswer)
 same => n,Return()

[to_homeassistant]
; Default context (optional)
exten => _X.,1,Dial(PJSIP/homeassistant/${EXTEN})
 same => n,HangUp()

[default]
; Catch-all for safety
exten => _X.,1,Busy()
 same => n,HangUp()
