[general]
; Asterisk Extensions Configuration
; Routes Yealink calls to Home Assistant

[from_yealink]
; Hotline to Home Assistant - use homeassistant endpoint
exten => 100,1,Answer()
 same => n,Verbose(2,Hotline to HA)
 same => n,Dial(PJSIP/homeassistant,30)
 same => n,HangUp()

; When Yealink picks up phone (offhook without dialing), dial hotline
exten => s,1,Answer()
 same => n,Verbose(2,Yealink offhook - calling HA)
 same => n,Dial(PJSIP/homeassistant,30)
 same => n,HangUp()

; Fallback for any other extension dialed
exten => _X.,1,Answer()
 same => n,Verbose(2,Forwarding to HA: ${EXTEN})
 same => n,Dial(PJSIP/homeassistant/${EXTEN},30)
 same => n,HangUp()

[from_homeassistant]
; Calls coming FROM Home Assistant (if needed)
exten => _X.,1,Answer()
 same => n,Verbose(2,HA calling Yealink: ${EXTEN})
 same => n,Dial(PJSIP/yealink,30)
 same => n,HangUp()

[to_homeassistant]
; Default context (optional)
exten => _X.,1,Dial(PJSIP/homeassistant/${EXTEN})
 same => n,HangUp()

[default]
; Catch-all for safety
exten => _X.,1,Busy()
 same => n,HangUp()
