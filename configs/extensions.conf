[general]
; Asterisk Extensions Configuration
; Routes Yealink calls to Home Assistant, and Home Assistant calls
; to the Yealink(s) as an intercom (auto-answer on speaker).

[from_yealink]
; Hotline to Home Assistant - use homeassistant endpoint
exten => 100,1,Answer()
 same => n,Verbose(2,Hotline to HA)
 same => n,Dial(PJSIP/homeassistant,30)
 same => n,HangUp()

; Ring the OTHER phone (101) from any registered Yealink
exten => 101,1,Answer()
 same => n,Dial(PJSIP/yealink,30)
 same => n,HangUp()

; When Yealink picks up phone (offhook without dialing), dial hotline
exten => s,1,Answer()
 same => n,Verbose(2,Yealink offhook - calling HA)
 same => n,Dial(PJSIP/homeassistant,30)
 same => n,HangUp()

; Fallback for any other extension dialed
exten => _X.,1,Answer()
 same => n,Verbose(2,Forwarding to HA: ${EXTEN})
 same => n,Dial(PJSIP/homeassistant/${EXTEN},30)
 same => n,HangUp()

[from_homeassistant]
; Calls coming FROM Home Assistant -> announce to the Yealinks, ONE PHONE PER
; CALL. The HA automation fires the announcement twice and this context
; ALTERNATES which phone each call reaches (GLOBAL(HA_PHONE) toggles).
;
; WHY the alternation: a single HA call cannot reach two phones. CHAINING two
; Dial()s in one call does not work either -- once the first phone's media
; stops, HA's voip_utils tears its own call down (~2s RTP watchdog), so the
; second Dial has no caller left. (Verified.)
;
; Each call is a plain Dial():
;   * the caller is answered only when the phone auto-answers, so NO audio is
;     clipped (Page()/ConfBridge answer the caller up-front and clip the first
;     ~1s of TTS while the phones are still joining);
;   * S(x) is a reliable hangup -- HA's satellite never ends the call itself;
;   * no conference is involved. Page()/ConfBridge additionally HUNG the call
;     open (TIMEOUT(absolute) does not fire inside ConfBridge, leaving the
;     phones off-hook) and eventually DEADLOCKED the PBX (channels stopped
;     answering hangup requests; needed a full restart). Avoid it.
exten => asterisk,1,GotoIf($["${GLOBAL(HA_PHONE)}" = "yealink2"]?y2)
 same => n,Set(GLOBAL(HA_PHONE)=yealink2)
 same => n,Verbose(2,HA announcement -> yealink)
 same => n,Dial(PJSIP/yealink,30,S(6)b(intercom^s^1))
 same => n,HangUp()
 same => n(y2),Set(GLOBAL(HA_PHONE)=yealink)
 same => n,Verbose(2,HA announcement -> yealink2)
 same => n,Dial(PJSIP/yealink2,30,S(6)b(intercom^s^1))
 same => n,HangUp()

exten => _X.,1,Goto(asterisk,1)

[intercom]
; Pre-dial handler (b(intercom^s^1) in the Dial above): runs on the
; OUTGOING Yealink leg right before the INVITE is sent and injects the
; header the phone uses to auto-answer hands-free on speaker. Yealink
; honours any of:
;   Alert-Info: auto answer
;   Alert-Info: info=alert-autoanswer
;   Alert-Info: answer-after=0
;   Call-Info: ;answer-after=0
; The phone's per-account "Auto Answer" must be enabled for this to fire.
exten => s,1,Set(PJSIP_HEADER(add,Alert-Info)=info=alert-autoanswer)
 same => n,Return()

[to_homeassistant]
; Default context (optional)
exten => _X.,1,Dial(PJSIP/homeassistant/${EXTEN})
 same => n,HangUp()

[default]
; Catch-all for safety
exten => _X.,1,Busy()
 same => n,HangUp()
